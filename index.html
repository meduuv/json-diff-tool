<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Diff</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#08090c;color:#e9ebf0}.wrap{max-width:1200px;margin:auto;padding:30px 16px}h1{margin:0 0 6px;font-size:28px}p{color:#9298a6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}textarea{width:100%;height:330px;background:#0f1117;border:1px solid #252a35;border-radius:12px;padding:14px;color:#dfe4ee;font:13px/1.5 ui-monospace,monospace;resize:vertical}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{background:#151923;border:1px solid #303746;color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.card{background:#0d0f14;border:1px solid #202531;border-radius:14px;padding:14px}.summary{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#151923;border-radius:8px;padding:6px 9px;font-size:12px}.diff{margin-top:12px;font:12px/1.5 ui-monospace,monospace;overflow:auto}.item{border-bottom:1px solid #1b1f27;padding:7px}.add{background:rgba(70,190,120,.08)}.del{background:rgba(230,90,90,.08)}.same{opacity:.72}.path{color:#91b9ff}.wm{position:fixed;right:12px;bottom:8px;opacity:.035;font:10px monospace;pointer-events:none}</style></head><body><div class="wrap"><h1>JSON Diff</h1><p>Compare two JSON documents structurally, entirely in your browser.</p><div class="grid"><div class="card"><b>Left</b><textarea id="a" spellcheck="false" placeholder='{"name":"medu","count":1}'></textarea></div><div class="card"><b>Right</b><textarea id="b" spellcheck="false" placeholder='{"name":"medu","count":2}'></textarea></div></div><div class="bar"><button id="compare">Compare</button><button id="pretty">Pretty print</button><button id="swap">Swap</button><button id="demo">Demo</button></div><div class="card"><div class="summary" id="summary"></div><div class="diff" id="diff">Enter two JSON documents.</div></div></div><div class="wm">guns.lol/meduu</div><script>
const $=s=>document.querySelector(s),a=$('#a'),b=$('#b'),summary=$('#summary'),diff=$('#diff');
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flat(v,path='',out={}){if(v&&typeof v==='object'&&!Array.isArray(v)){for(const k of Object.keys(v).sort())flat(v[k],path?path+'.'+k:k,out)}else if(Array.isArray(v)){v.forEach((x,i)=>flat(x,`${path}[${i}]`,out));if(!v.length)out[path]='[]'}else out[path]=v;return out}
function compare(){let x,y;try{x=JSON.parse(a.value);y=JSON.parse(b.value)}catch(e){diff.innerHTML='<p>Invalid JSON: '+esc(e.message)+'</p>';return}const L=flat(x),R=flat(y),keys=[...new Set([...Object.keys(L),...Object.keys(R)])].sort();let add=0,del=0,chg=0,same=0;const rows=[];for(const k of keys){const hasL=Object.prototype.hasOwnProperty.call(L,k),hasR=Object.prototype.hasOwnProperty.call(R,k);if(!hasL){add++;rows.push(`<div class="item add"><span class="path">+ ${esc(k)}</span> = ${esc(JSON.stringify(R[k]))}</div>`)}else if(!hasR){del++;rows.push(`<div class="item del"><span class="path">- ${esc(k)}</span> = ${esc(JSON.stringify(L[k]))}</div>`)}else if(JSON.stringify(L[k])!==JSON.stringify(R[k])){chg++;rows.push(`<div class="item"><span class="path">~ ${esc(k)}</span><br>${esc(JSON.stringify(L[k]))} → ${esc(JSON.stringify(R[k]))}</div>`)}else{same++;rows.push(`<div class="item same"><span class="path">= ${esc(k)}</span> = ${esc(JSON.stringify(L[k]))}</div>`)}}summary.innerHTML=`<span class="pill">${add} added</span><span class="pill">${del} removed</span><span class="pill">${chg} changed</span><span class="pill">${same} unchanged</span>`;diff.innerHTML=rows.join('')||'<p>No scalar fields to compare.</p>'}
$('#compare').onclick=compare;$('#pretty').onclick=()=>{for(const t of [a,b])try{t.value=JSON.stringify(JSON.parse(t.value),null,2)}catch{}};$('#swap').onclick=()=>{[a.value,b.value]=[b.value,a.value];compare()};$('#demo').onclick=()=>{a.value=JSON.stringify({name:'medu',version:1,features:['api','tools'],settings:{theme:'dark',debug:false}},null,2);b.value=JSON.stringify({name:'medu',version:2,features:['api','tools','bots'],settings:{theme:'dark',debug:true}},null,2);compare()};
</script><!-- by guns.lol/meduu --></body></html>
